services:
  pmg-cloud:
    build: .
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      - PMG_CLOUD_API_KEYS=changeme
      # Set to your public domain — gRPC is muxed on port 8080 alongside the dashboard.
      # Cloudflare Tunnel forwards HTTP/2 so gRPC reaches agents via host:443 with valid TLS.
      # Example: your-domain.com:443
      - PMG_CLOUD_GRPC_PUBLIC_ADDR=your-domain.com:443
    # Disable dedicated gRPC port (--addr=); gRPC is served on --http-addr via h2c mux.
    command: ["--addr=", "--data-dir=/data", "--http-addr=:8080"]
