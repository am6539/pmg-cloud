services:
  pmg-cloud:
    build: .
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      - PMG_CLOUD_API_KEYS=changeme
    # gRPC runs without TLS — nginx handles HTTPS for the dashboard on port 443.
    # To enable TLS on gRPC, remove --insecure and mount valid certs to /certs.
    command: ["--addr=:8443", "--data-dir=/data", "--insecure"]
