services:
  pmg-cloud:
    build: .
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      - PMG_CLOUD_API_KEYS=changeme
    # gRPC is muxed on --http-addr via h2c. Nginx terminates TLS and forwards to :8080.
    # --grpc-public-addr tells enrolling agents to connect back via the public domain.
    command: ["--addr=", "--data-dir=/data", "--http-addr=:8080", "--grpc-public-addr=vgpmg.ovp.vn:443"]
