<!DOCTYPE html>
<html lang="en" id="H">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMG Cloud</title>
<style>
:root{--bg:#f9fafb;--sf:#fff;--bd:#e5e7eb;--tx:#111827;--tx2:#374151;--tx3:#6b7280;--tx4:#9ca3af;--pr:#0D9488;--pr-bg:#f0fdfa;--dn:#dc2626;--dn-bg:#fef2f2;--wn:#d97706;--wn-bg:#fffbeb;--ok:#16a34a;--ok-bg:#f0fdf4;--hv:#f3f4f6;--hv2:#f9fafb;--sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 8px 24px rgba(0,0,0,.14);--r:10px}
.dark{--bg:#0f172a;--sf:#1e293b;--bd:#334155;--tx:#f1f5f9;--tx2:#e2e8f0;--tx3:#94a3b8;--tx4:#64748b;--pr-bg:#134e4a;--dn-bg:#450a0a;--wn-bg:#451a03;--ok-bg:#052e16;--hv:#334155;--hv2:#1e293b;--sh:0 1px 3px rgba(0,0,0,.3);--sh2:0 8px 24px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden;transition:background .2s,color .2s}
input,select,button,textarea{font-family:inherit}
.sidebar{width:218px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:17px 18px 13px;border-bottom:1px solid var(--bd)}
.sidebar-logo strong{font-size:16px;font-weight:700;color:var(--pr);letter-spacing:-.3px}
.sidebar-logo small{display:block;font-size:11px;color:var(--tx4);margin-top:2px}
.nav-section{font-size:10px;font-weight:600;color:var(--tx4);text-transform:uppercase;letter-spacing:.8px;padding:10px 14px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--tx2);margin:1px 6px;white-space:nowrap;user-select:none}
.nav-item:hover{background:var(--hv)}
.nav-item.active{background:var(--pr-bg);color:var(--pr);font-weight:600}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 18px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:600;flex-shrink:0;min-width:100px}
.tb-mid{flex:1;display:flex;align-items:center;gap:8px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tb-mid::-webkit-scrollbar{display:none}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.group-sel{padding:5px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-size:12.5px;max-width:150px;cursor:pointer}
.period-tabs{display:flex;gap:2px;background:var(--hv);border-radius:8px;padding:3px;flex-shrink:0}
.period-tab{padding:4px 11px;border-radius:5px;border:none;background:transparent;font-size:12px;cursor:pointer;color:var(--tx3);font-weight:500;white-space:nowrap}
.period-tab.active{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.date-row{display:flex;align-items:center;gap:4px;font-size:12px;flex-shrink:0}
.date-row input{padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);font-size:12px;width:112px}
.icon-btn{width:30px;height:30px;border:none;background:none;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:15px;flex-shrink:0}
.icon-btn:hover{background:var(--hv);color:var(--tx)}
.alert-bar{padding:8px 18px;font-size:13px;display:none;align-items:center;gap:8px;flex-shrink:0}
.alert-bar.warn{display:flex;background:var(--wn-bg);color:var(--wn);border-bottom:1px solid #fde68a}
.alert-bar.danger{display:flex;background:var(--dn-bg);color:var(--dn);border-bottom:1px solid #fca5a5}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px}
.kpi-lbl{font-size:12px;color:var(--tx3);font-weight:500;margin-bottom:7px}
.kpi-val{font-size:26px;font-weight:700;line-height:1.15}
.kpi-delta{font-size:11px;margin-top:4px}
.d-up{color:var(--dn)}.d-dn{color:var(--ok)}.d-ne{color:var(--tx4)}
.kpi.danger .kpi-val{color:var(--dn)}.kpi.warn .kpi-val{color:var(--wn)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:15px 18px;margin-bottom:18px}
.card-title{font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.cb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cb{width:100%;background:var(--pr);border-radius:2px 2px 0 0;min-height:2px;cursor:default}
.cb:hover{opacity:.7}
.cb-lbl{font-size:8px;color:var(--tx4);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;max-height:32px}
.heatmap{display:flex;gap:2px;flex-direction:column;flex-wrap:wrap;height:104px;align-content:flex-start}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--hv);flex-shrink:0}
.hm-cell.l1{background:#bbf7d0}.hm-cell.l2{background:#4ade80}.hm-cell.l3{background:#16a34a}.hm-cell.l4{background:#15803d}
.dark .hm-cell.l1{background:#14532d}.dark .hm-cell.l2{background:#166534}.dark .hm-cell.l3{background:#15803d}.dark .hm-cell.l4{background:#16a34a}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:920px){.two-col{grid-template-columns:1fr}}
.sec-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title small{font-size:12px;font-weight:400;color:var(--tx3)}
.tbl-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 13px;background:var(--hv2);color:var(--tx3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd)}
td{padding:9px 13px;border-bottom:1px solid var(--bd);color:var(--tx2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hv)}
.clickable{cursor:pointer}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.b-red{background:var(--dn-bg);color:var(--dn)}.b-green{background:var(--ok-bg);color:var(--ok)}.b-yellow{background:var(--wn-bg);color:var(--wn)}.b-gray{background:var(--hv);color:var(--tx3)}.b-teal{background:var(--pr-bg);color:var(--pr)}.b-blue{background:#eff6ff;color:#1d4ed8}
.dark .b-blue{background:#1e3a5f;color:#93c5fd}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--pr);color:#fff}.btn-ghost{background:var(--sf);border:1px solid var(--bd);color:var(--tx2)}.btn-sm{padding:4px 10px;font-size:12px}.btn-danger{background:var(--dn-bg);color:var(--dn);border:1px solid #fca5a5}
.input{padding:7px 12px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-size:13px;width:100%;outline:none}
.input:focus{border-color:var(--pr)}
.lbl{font-size:12px;font-weight:500;color:var(--tx3);margin-bottom:5px;display:block}
.fg{margin-bottom:13px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-size:12.5px}
.pager{display:flex;align-items:center;gap:8px;padding:8px 0}
.pager .info{font-size:12px;color:var(--tx3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--sf);border-radius:12px;padding:22px;width:560px;max-width:96vw;max-height:86vh;overflow-y:auto;box-shadow:var(--sh2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.drawer-bg{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.3)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:95vw;background:var(--sf);border-left:1px solid var(--bd);box-shadow:var(--sh2);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.drawer.open{transform:translateX(0)}
.drawer-hdr{padding:15px 17px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.drawer-hdr h2{font-size:15px;font-weight:600}
.drawer-body{padding:17px;overflow-y:auto;flex:1}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tab{padding:7px 15px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.active{color:var(--pr);border-bottom-color:var(--pr)}
.toggle{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--bd);border-radius:20px;cursor:pointer;transition:.2s}
.tog-sl::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.tog-sl{background:var(--pr)}
input:checked+.tog-sl::before{transform:translateX(16px)}
.empty{text-align:center;padding:38px;color:var(--tx4);font-size:13px}
.mono{font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
hr{border:none;border-top:1px solid var(--bd);margin:13px 0}
.flex{display:flex;align-items:center;gap:8px}
.key-box{background:var(--hv);border-radius:8px;padding:11px 15px;font-family:monospace;font-size:12.5px;word-break:break-all;border:1px solid var(--bd);margin:10px 0;color:var(--tx2)}
.wiz-step{text-align:center;padding:12px 0}
.wiz-icon{font-size:44px;margin-bottom:12px}
.wiz-title{font-size:20px;font-weight:700;margin-bottom:8px}
.wiz-desc{color:var(--tx3);font-size:13.5px;margin-bottom:20px;line-height:1.6}
.bar-wrap{flex:1;height:6px;background:var(--hv);border-radius:3px;overflow:hidden;min-width:60px}
.bar-fill{height:6px;background:var(--pr);border-radius:3px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
code{background:var(--hv);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}
.login-overlay{position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.login-box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:32px 36px;width:340px;max-width:94vw;box-shadow:var(--sh2)}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--sh2);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:auto;max-width:320px;word-break:break-word}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:#052e16;color:#4ade80;border:1px solid #166534}
.toast-error{background:#450a0a;color:#fca5a5;border:1px solid #991b1b}
.toast-info{background:var(--sf);color:var(--tx2);border:1px solid var(--bd)}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<nav class="sidebar">
  <div class="sidebar-logo">
    <strong>&#11043; PMG Cloud</strong>
    <small>Security Dashboard</small>
  </div>
  <div style="padding:6px 0 10px">
    <div class="nav-section">Analytics</div>
    <div class="nav-item active" onclick="nav('dashboard')" data-page="dashboard">&#128202; Overview</div>
    <div class="nav-item" onclick="nav('events')" data-page="events">&#128203; Events</div>
    <div class="nav-item" onclick="nav('endpoints')" data-page="endpoints">&#128187; Endpoints</div>
    <div class="nav-item" onclick="nav('packages')" data-page="packages">&#128230; Packages</div>
    <div class="nav-item" onclick="nav('cicd')" data-page="cicd">&#128256; CI / CD</div>
    <div class="nav-item" onclick="nav('malware')" data-page="malware">&#128737; Malware Feed</div>
    <div class="nav-section">Management</div>
    <div class="nav-item" onclick="nav('agents')" data-page="agents">&#128290; Agents</div>
    <div class="nav-item" onclick="nav('groups')" data-page="groups">&#128101; Groups</div>
    <div class="nav-item" onclick="nav('audit')" data-page="audit">&#128220; Audit Log</div>
    <div class="nav-item" onclick="nav('settings')" data-page="settings">&#9881; Settings</div>
  </div>
  <div id="sb-user-bar" style="padding:10px 12px;border-top:1px solid var(--bd);flex-shrink:0;display:none">
    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:6px">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--tx2)" id="sb-username"></div>
        <div style="font-size:11px;color:var(--tx4)" id="sb-role"></div>
      </div>
      <button class="icon-btn" onclick="doLogout()" title="Sign out" style="font-size:16px">&#10551;</button>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:100%;font-size:11px" onclick="showChangePwd()">&#128273; Change Password</button>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <h1 id="page-title">Overview</h1>
    <div class="tb-mid">
      <select class="group-sel" id="group-sel" onchange="setGroup(this.value)">
        <option value="">All groups</option>
      </select>
      <div class="period-tabs">
        <button class="period-tab" data-days="7" onclick="setPeriod(7)">7d</button>
        <button class="period-tab active" data-days="30" onclick="setPeriod(30)">30d</button>
        <button class="period-tab" data-days="90" onclick="setPeriod(90)">90d</button>
        <button class="period-tab" data-days="-1" onclick="showDateRange()">Custom</button>
      </div>
      <div class="date-row" id="date-row" style="display:none">
        <input type="date" id="from-date">
        <span style="color:var(--tx4)">&#8211;</span>
        <input type="date" id="to-date">
        <button class="btn btn-sm btn-primary" onclick="applyDateRange()">Apply</button>
      </div>
    </div>
    <div class="tb-right">
      <span id="ar-cd" style="font-size:11px;color:var(--tx4)"></span>
      <button class="icon-btn" onclick="loadPage()" title="Refresh">&#8635;</button>
      <button class="icon-btn" id="dark-btn" onclick="toggleDark()" title="Toggle dark mode">&#127769;</button>
    </div>
  </div>
  <div class="alert-bar" id="alert-bar"></div>
  <div class="content" id="content"><div class="empty"><span class="spin">&#8635;</span> Loading&#8230;</div></div>
</div>

<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body" onclick="event.stopPropagation()"></div>
</div>

<div class="drawer-bg" id="drawer-bg" style="display:none" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr">
    <h2 id="drawer-title">Details</h2>
    <button class="icon-btn" onclick="closeDrawer()">&#x2715;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="login-overlay" id="login-overlay" style="display:none">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:34px;margin-bottom:8px">&#11043;</div>
      <strong style="font-size:20px;color:var(--pr)">PMG Cloud</strong>
      <div style="font-size:13px;color:var(--tx3);margin-top:5px">Sign in to continue</div>
    </div>
    <div class="fg"><label class="lbl">Username</label><input class="input" id="li-user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fg"><label class="lbl">Password</label><input class="input" type="password" id="li-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div style="color:var(--dn);font-size:12px;margin-bottom:10px;min-height:18px" id="li-err"></div>
    <button class="btn btn-primary" style="width:100%;padding:9px" id="li-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<script>
/* ---- TOAST ---- */
function showToast(msg,type){
  var c=document.getElementById('toast-container');if(!c)return;
  var t=document.createElement('div');
  t.className='toast toast-'+(type||'info');
  t.textContent=msg;
  c.appendChild(t);
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('show');});});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},220);},3000);
}
/* ---- STATE ---- */
var S={page:'dashboard',group:'',days:30,from:'',to:'',useRange:false,evOffset:0,evFilter:{type:'',action:'',malware:''},pkgTab:0,dark:localStorage.dark==='1',groups:[],config:null,me:null};

document.addEventListener('DOMContentLoaded',function(){
  applyTheme();
  checkAuth().then(function(ok){
    if(!ok)return;
    initGroups().then(function(){
      checkAlerts();
      loadPage();
      startAR();
      checkWizard();
    });
  });
});

function applyTheme(){document.getElementById('H').classList.toggle('dark',S.dark);document.getElementById('dark-btn').textContent=S.dark?'☀':'🌙';}
function toggleDark(){S.dark=!S.dark;localStorage.dark=S.dark?'1':'0';applyTheme();}

async function initGroups(){
  try{
    S.groups=await api('/api/groups');
    var sel=document.getElementById('group-sel');
    S.groups.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.name+' ('+(g.key_count||0)+')';sel.appendChild(o);});
  }catch(e){}
}
function setGroup(id){S.group=id;loadPage();}

function setPeriod(days){
  S.days=days;S.useRange=false;
  document.querySelectorAll('.period-tab').forEach(function(el){el.classList.toggle('active',parseInt(el.dataset.days)===days);});
  document.getElementById('date-row').style.display='none';
  loadPage();
}
function showDateRange(){document.querySelectorAll('.period-tab').forEach(function(el){el.classList.remove('active');});document.getElementById('date-row').style.display='flex';}
function applyDateRange(){S.from=document.getElementById('from-date').value;S.to=document.getElementById('to-date').value;if(!S.from||!S.to)return;S.useRange=true;loadPage();}

var arT,arN=30;
function startAR(){clearInterval(arT);arN=30;arT=setInterval(function(){arN--;var el=document.getElementById('ar-cd');if(el)el.textContent=arN+'s';if(arN<=0){arN=30;loadPage();}},1000);}

/* ---- AUTH ---- */
async function checkAuth(){
  try{
    var r=await fetch('/api/me');
    if(r.status===401){showLoginOverlay();return false;}
    S.me=await r.json();
    document.getElementById('login-overlay').style.display='none';
    updateSidebarUser();
    return true;
  }catch(e){showLoginOverlay();return false;}
}

function showLoginOverlay(){
  var el=document.getElementById('login-overlay');
  if(el)el.style.display='flex';
  var lp=document.getElementById('li-pass');if(lp)lp.value='';
  var le=document.getElementById('li-err');if(le)le.textContent='';
  setTimeout(function(){var lu=document.getElementById('li-user');if(lu)lu.focus();},80);
}

function updateSidebarUser(){
  if(!S.me)return;
  var un=document.getElementById('sb-username');var ur=document.getElementById('sb-role');var ub=document.getElementById('sb-user-bar');
  if(un)un.textContent=S.me.username;
  if(ur)ur.textContent=S.me.role==='admin'?'Admin':'Viewer';
  if(ub)ub.style.display='block';
  if(S.me.must_change_password)setTimeout(showChangePwd,300);
}

async function doLogin(){
  var user=(document.getElementById('li-user')||{}).value||'';
  var pass=(document.getElementById('li-pass')||{}).value||'';
  if(!user||!pass)return;
  var btn=document.getElementById('li-btn');var err=document.getElementById('li-err');
  btn.disabled=true;err.textContent='';
  try{
    var r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});

/* ---- HELPERS ---- */
function fmt(n){return(n||0).toLocaleString();}
function fmtDate(s){if(!s)return'&mdash;';var d=new Date(s);return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function bdg(t,c){c=c||'gray';return'<span class="badge b-'+c+'">'+h(t)+'</span>';}
function actionBdg(a){var m={allow:'green',block:'red',suspicious:'yellow',allow_install:'teal',block_install:'red',allow_lockfile:'teal'};return bdg(a||'&mdash;',m[a]||'gray');}
function ecoBdg(e){var m={npm:'blue',pypi:'yellow',go:'teal',cargo:'red',maven:'gray',nuget:'blue'};return bdg(e||'&mdash;',m[(e||'').toLowerCase()]||'gray');}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trunc(s,n){n=n||30;return(!s)?'&mdash;':s.length>n?h(s.slice(0,n))+'&hellip;':h(s);}

function computeDelta(days){
  if(!days||days.length<4)return'';
  var half=Math.floor(days.length/2);
  var prev=days.slice(0,half).reduce(function(s,d){return s+d.count;},0);
  var curr=days.slice(half).reduce(function(s,d){return s+d.count;},0);
  if(!prev)return'';
  var pct=Math.round((curr-prev)/prev*100);
  var cls=pct>0?'d-up':pct<0?'d-dn':'d-ne';
  var arrow=pct>0?'&#8593;':pct<0?'&#8595;':'&#8594;';
  return'<div class="kpi-delta '+cls+'">'+arrow+Math.abs(pct)+'% vs prev period</div>';
}

function buildChart(days){
  if(!days.length)return'<div class="empty">No data</div>';
  var max=Math.max.apply(null,days.map(function(d){return d.count;}).concat(1));
  return'<div class="chart-bars">'+days.slice(-30).map(function(d){
    var pct=Math.max(2,Math.round(d.count/max*100));
    return'<div class="cb-wrap"><div class="cb" style="height:'+pct+'%" title="'+h(d.date)+': '+d.count+'"></div><div class="cb-lbl">'+h(d.date.slice(5))+'</div></div>';
  }).join('')+'</div>';
}

function buildHeatmap(days){
  var map={};days.forEach(function(d){map[d.date]=d.count;});
  var vals=Object.values(map).concat(0);
  var max=Math.max.apply(null,vals);if(!max)max=1;
  var cells=[];
  for(var i=89;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var k=d.toISOString().slice(0,10);
    var c=map[k]||0;
    var l=c===0?'':c<max*.25?'l1':c<max*.5?'l2':c<max*.75?'l3':'l4';
    cells.push('<div class="hm-cell '+l+'" title="'+k+': '+c+'"></div>');
  }
  return'<div class="heatmap">'+cells.join('')+'</div>';
}

function barList(obj,colorMap){
  colorMap=colorMap||{};
  var entries=Object.entries(obj).sort(function(a,b){return b[1]-a[1];});
  if(!entries.length)return'<div class="empty">No data</div>';
  var mx=Math.max.apply(null,entries.map(function(e){return e[1];}).concat(1));
  return entries.map(function(e){
    return'<div class="flex" style="margin-bottom:7px">'+bdg(e[0],colorMap[(e[0]||'').toLowerCase()]||'gray')+
    '<div class="bar-wrap" style="margin:0 8px"><div class="bar-fill" style="width:'+Math.round(e[1]/mx*100)+'%"></div></div>'+
    '<span style="font-size:13px;font-weight:600;min-width:36px;text-align:right">'+fmt(e[1])+'</span></div>';
  }).join('');
}

function versionCompliance(eps){
  if(!eps.length)return'';
  var vc={};
  eps.forEach(function(ep){var v=ep.tool_version||'unknown';vc[v]=(vc[v]||0)+1;});
  var knownVers=Object.keys(vc).filter(function(v){return v!=='unknown';}).sort();
  var latest=knownVers.length?knownVers[knownVers.length-1]:'unknown';
  var outdated=eps.filter(function(ep){return(ep.tool_version||'unknown')!==latest;}).length;
  return'<div class="card"><div class="card-title">PMG Version Compliance '+
  (outdated>0?bdg(outdated+' outdated','red'):bdg('All up-to-date','green'))+'</div>'+
  '<p style="font-size:13px;color:var(--tx3);margin-bottom:12px">Latest detected: <strong>'+h(latest)+'</strong></p>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Version</th><th>Endpoints</th><th>Status</th></tr></thead><tbody>'+
  Object.keys(vc).sort().map(function(v){
    return'<tr><td class="mono">'+h(v)+'</td><td>'+vc[v]+'</td><td>'+(v===latest?bdg('Latest','green'):bdg('Outdated','yellow'))+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
}

function renderTopPkgs(pkgs){
  _pkgs=pkgs;
  document.getElementById('pkg-inner').innerHTML=
'<div class="tbl-wrap"><table><thead><tr><th>Package</th><th>Ecosystem</th><th>Installs</th><th>Blocked</th></tr></thead><tbody>'+
(pkgs.length?pkgs.map(function(p,i){
  return'<tr class="clickable" onclick="openPkgModal('+i+')">'+
  '<td><strong>'+h(p.name)+'</strong></td><td>'+ecoBdg(p.ecosystem)+'</td>'+
  '<td>'+fmt(p.count)+'</td><td>'+((p.blocked_count||0)>0?bdg(fmt(p.blocked_count),'red'):'0')+'</td></tr>';
}).join(''):'<tr><td colspan="4" class="empty">No data</td></tr>')+
'</tbody></table></div>';
}

function renderRisk(pkgs){
  var sorted=pkgs.filter(function(p){return p.count>0;}).map(function(p){
    return Object.assign({},p,{risk:Math.round((p.blocked_count||0)/p.count*100)});
  }).sort(function(a,b){return b.risk-a.risk;});
  _pkgs=sorted;
  document.getElementById('pkg-inner').innerHTML=
'<div class="tbl-wrap"><table><thead><tr><th>Package</th><th>Ecosystem</th><th>Block Rate</th><th>Blocked</th><th>Total</th></tr></thead><tbody>'+
(sorted.length?sorted.map(function(p,i){
  var riskColor=p.risk>50?'var(--dn)':p.risk>20?'var(--wn)':'var(--pr)';
  return'<tr class="clickable" onclick="openPkgModal('+i+')">'+
  '<td><strong>'+h(p.name)+'</strong></td><td>'+ecoBdg(p.ecosystem)+'</td>'+
  '<td><div class="flex" style="gap:6px;min-width:80px">'+
  '<div class="bar-wrap"><div class="bar-fill" style="width:'+p.risk+'%;background:'+riskColor+'"></div></div>'+
  '<span style="font-size:12px;font-weight:600;color:'+riskColor+'">'+p.risk+'%</span></div></td>'+
  '<td>'+bdg(fmt(p.blocked_count||0),'red')+'</td><td>'+fmt(p.count)+'</td></tr>';
}).join(''):'<tr><td colspan="5" class="empty">No data</td></tr>')+
'</tbody></table></div>';
}

function renderEco(eco){
  document.getElementById('pkg-inner').innerHTML=
'<div class="tbl-wrap"><table><thead><tr><th>Ecosystem</th><th>Installs</th></tr></thead><tbody>'+
(eco.length?eco.map(function(e){return'<tr><td>'+ecoBdg(e.ecosystem||e.name)+'</td><td>'+fmt(e.count)+'</td></tr>';}).join(''):'<tr><td colspan="2" class="empty">No data</td></tr>')+
'</tbody></table></div>';
}

async function createEnrollToken(){
  var label=(document.getElementById('et-label')||{}).value||'';
  var groupId=(document.getElementById('et-group')||{}).value||'';
  var maxUses=parseInt((document.getElementById('et-uses')||{}).value)||0;
  var ttlHours=parseInt((document.getElementById('et-ttl')||{}).value)||0;
  try{
    var r=await fetch('/api/enrollment-tokens',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label:label,group_id:groupId,max_uses:maxUses,ttl_hours:ttlHours})});
    if(!r.ok){var d=await r.json().catch(function(){return{};});showToast(d.error||'Error','error');return;}
    var data=await r.json();
    var token=data.secret||'';
    var origin=window.location.origin;
    var installCmd='curl -fsSL '+origin+'/install.sh | sh -s -- --token='+token;
    closeModal();
    showModal('<div class="modal-title">&#10003; Token Created <button class="icon-btn" onclick="closeModal();renderAgents()">&#x2715;</button></div>'+
    '<div style="color:var(--dn);font-size:13px;margin-bottom:10px;padding:10px;background:var(--dn-bg);border-radius:8px">'+
    '&#9888;&#65039; Copy this token now — it will <strong>not</strong> be shown again.</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin-bottom:4px">Token:</p>'+
    '<div class="key-box" id="et-token-box">'+h(token)+'</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin:10px 0 4px">One-line install command:</p>'+
    '<div class="key-box" style="font-size:11px" id="et-cmd-box">'+h(installCmd)+'</div>'+
    '<div class="modal-footer">'+
    '<button class="btn btn-primary" id="et-copy-btn" onclick="navigator.clipboard.writeText(document.getElementById(\'et-cmd-box\').textContent).then(function(){document.getElementById(\'et-copy-btn\').textContent=\'Copied ✓\';})">&#128203; Copy Command</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();renderAgents()">Done</button></div>');
  }catch(e){showToast('Error: '+e.message,'error');}
}

async function revokeEnrollToken(id){
  if(!confirm('Revoke this enrollment token? Machines that haven\'t enrolled yet won\'t be able to use it.'))return;
  try{await fetch('/api/enrollment-tokens/'+id,{method:'DELETE'});await renderAgents();}
  catch(e){showToast('Error: '+e.message,'error');}
}

function openAssignGroup(agentId,currentGroupId){
  var groupOpts='<option value="">Unassign</option>'+(S.groups||[]).map(function(g){return'<option value="'+h(g.id)+'"'+(g.id===currentGroupId?' selected':'')+'>'+h(g.name)+'</option>';}).join('');
  showModal('<div class="modal-title">Assign Agent to Group <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="fg"><label class="lbl">Group</label><select class="input" id="ag-group">'+groupOpts+'</select></div>'+
  '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
  '<button class="btn btn-primary" onclick="assignAgentGroup(\''+h(agentId)+'\')">Save</button></div>');
}

async function assignAgentGroup(id){
  var groupId=(document.getElementById('ag-group')||{}).value||'';
  try{
    var r=await fetch('/api/agents/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_id:groupId})});
    if(!r.ok){var d=await r.json().catch(function(){return{};});showToast(d.error||'Error','error');return;}
    closeModal();await renderAgents();
  }catch(e){showToast('Error: '+e.message,'error');}
}

async function removeAgent(id,hostname){
  if(!confirm('Remove agent "'+hostname+'"? Its API key will be revoked.'))return;
  try{
    var r=await fetch('/api/agents/'+id,{method:'DELETE'});
    if(!r.ok){var d=await r.json().catch(function(){return{};});showToast(d.error||'Error','error');return;}
    await renderAgents();
  }catch(e){showToast('Error: '+e.message,'error');}
}

/* ---- GROUPS ---- */
var grpList=[];
async function renderGroups(){
  grpList=await api('/api/groups');
  var out='<div class="sec-title">Groups <small>'+grpList.length+' total</small>'+
  '<button class="btn btn-primary btn-sm" onclick="openCreateGroup()">+ New Group</button></div>';
  if(!grpList.length)out+='<div class="empty">No groups yet. Create your first group to manage API keys.</div>';
  grpList.forEach(function(g,i){
    out+='<div class="card" style="margin-bottom:14px">'+
    '<div class="flex" style="justify-content:space-between;margin-bottom:10px">'+
    '<div class="flex"><strong style="font-size:15px">'+h(g.name)+'</strong>'+bdg((g.key_count||0)+' key'+(g.key_count!==1?'s':''),'gray')+'</div>'+
    '<div class="flex" style="gap:6px">'+
    '<button class="btn btn-sm btn-ghost" onclick="toggleKeys('+i+',\'keys-'+h(g.id)+'\')">&#128273; Keys</button>'+
    '<button class="btn btn-sm btn-primary" onclick="openCreateKey('+i+')">+ Add Key</button>'+
    '<button class="btn btn-sm btn-danger" onclick="deleteGroup(\''+h(g.id)+'\',\''+h(g.name)+'\')">Delete</button>'+
    '</div></div>'+
    '<div style="font-size:12px;color:var(--tx4)">ID: <span class="mono">'+h(g.id)+'</span></div>'+
    '<div id="keys-'+h(g.id)+'" style="display:none;margin-top:12px"></div>'+
    '</div>';
  });
  document.getElementById('content').innerHTML=out;
}

function toggleKeys(i,elId){var el=document.getElementById(elId);if(el.style.display==='none'){el.style.display='block';loadGroupKeys(i);}else{el.style.display='none';}}

async function loadGroupKeys(i){
  var g=grpList[i];
  var el=document.getElementById('keys-'+g.id);
  el.innerHTML='<div class="empty" style="padding:10px"><span class="spin">&#8635;</span></div>';
  try{
    var keys=await api('/api/groups/'+g.id+'/keys');
    if(!keys.length){el.innerHTML='<div class="empty" style="padding:10px">No keys</div>';return;}
    el.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Prefix</th><th>Created</th><th></th></tr></thead><tbody>'+
    keys.map(function(k){
      return'<tr><td>'+h(k.name||'&mdash;')+'</td>'+
      '<td class="mono" style="font-size:11px">'+h(k.key_prefix||'')+'&hellip;</td>'+
      '<td style="font-size:12px;color:var(--tx3)">'+fmtDate(k.created_at)+'</td>'+
      '<td><button class="btn btn-sm btn-danger" onclick="revokeKey(\''+h(g.id)+'\',\''+h(k.id)+'\','+i+')">Revoke</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  }catch(e){el.innerHTML='<div class="empty">Error: '+h(e.message)+'</div>';}
}

function openCreateGroup(){
  showModal('<div class="modal-title">Create Group <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="fg"><label class="lbl">Group Name</label><input class="input" id="ng-name" placeholder="e.g. Production team" onkeydown="if(event.key===\'Enter\')createGroup()"></div>'+
  '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createGroup()">Create</button></div>');
  setTimeout(function(){var el=document.getElementById('ng-name');if(el)el.focus();},80);
}

async function createGroup(){
  var name=(document.getElementById('ng-name')||{}).value;
  name=name?name.trim():'';if(!name)return;
  try{
    await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})});
    closeModal();await renderGroups();await refreshGroupSel();
  }catch(e){showToast('Error: '+e.message,'error');}
}

async function deleteGroup(id,name){
  if(!confirm('Delete group "'+name+'"? This cannot be undone.'))return;
  try{await fetch('/api/groups/'+id,{method:'DELETE'});await renderGroups();await refreshGroupSel();}
  catch(e){showToast('Error: '+e.message,'error');}
}

function openCreateKey(i){
  var g=grpList[i];
  showModal('<div class="modal-title">Add API Key &mdash; '+h(g.name)+' <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="fg"><label class="lbl">Key Name (optional)</label><input class="input" id="nk-name" placeholder="e.g. CI pipeline" onkeydown="if(event.key===\'Enter\')createKey(\''+h(g.id)+'\')"></div>'+
  '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createKey(\''+h(g.id)+'\')">Create Key</button></div>');
  setTimeout(function(){var el=document.getElementById('nk-name');if(el)el.focus();},80);
}

async function createKey(gid){
  var name=(document.getElementById('nk-name')||{}).value||'';name=name.trim();
  try{
    var r=await fetch('/api/groups/'+gid+'/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})});
    var data=await r.json();
    var secret=data.secret||'';
    var safeSecret=h(secret);
    showModal('<div class="modal-title">&#10003; Key Created <button class="icon-btn" onclick="closeModal();renderGroups()">&#x2715;</button></div>'+
    '<div style="color:var(--dn);font-size:13px;margin-bottom:10px;padding:10px;background:var(--dn-bg);border-radius:8px">'+
    '&#9888;&#65039; Copy this key now &mdash; it will <strong>not</strong> be shown again.</div>'+
    '<div class="key-box">'+safeSecret+'</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin:10px 0 4px">Add to PMG config:</p>'+
    '<div class="key-box" style="font-size:11px">cloud:\n  api_key: "'+safeSecret+'"\n  endpoint: "https://your-server:8443"</div>'+
    '<div class="modal-footer">'+
    '<button class="btn btn-primary" id="copy-key-btn" onclick="copyKey(\''+safeSecret+'\')">&#128203; Copy Key</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();renderGroups()">Done</button>'+
    '</div>');
  }catch(e){showToast('Error: '+e.message,'error');}
}

function copyKey(safeStr){
  var raw=safeStr.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  navigator.clipboard.writeText(raw).then(function(){var btn=document.getElementById('copy-key-btn');if(btn)btn.textContent='Copied ✓';});
}

async function revokeKey(gid,kid,grpIdx){
  if(!confirm('Revoke this key? PMG agents using it will lose access.'))return;
  try{await fetch('/api/groups/'+gid+'/keys/'+kid,{method:'DELETE'});loadGroupKeys(grpIdx);}
  catch(e){showToast('Error: '+e.message,'error');}
}

async function refreshGroupSel(){
  S.groups=await api('/api/groups').catch(function(){return[];});
  var sel=document.getElementById('group-sel');
  var cur=sel.value;
  sel.innerHTML='<option value="">All groups</option>';
  S.groups.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.name+' ('+(g.key_count||0)+')';if(g.id===cur)o.selected=true;sel.appendChild(o);});
}

/* ---- AUDIT ---- */
async function renderAudit(){
  var entries=await api('/api/audit?limit=200');
  document.getElementById('content').innerHTML=
'<div class="sec-title">Audit Log <small>'+entries.length+' entries</small></div>'+
'<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Subject</th><th>Detail</th></tr></thead><tbody>'+
(entries.length?entries.map(function(e){
  return'<tr>'+
  '<td style="font-size:12px;white-space:nowrap">'+fmtDate(e.timestamp)+'</td>'+
  '<td>'+bdg(e.action||'&mdash;','gray')+'</td>'+
  '<td class="trunc mono" style="font-size:11px">'+h(e.subject||'&mdash;')+'</td>'+
  '<td class="trunc" style="color:var(--tx3)">'+h(e.detail||'')+'</td></tr>';
}).join(''):'<tr><td colspan="4" class="empty">No audit entries</td></tr>')+
'</tbody></table></div>';
}

/* ---- SETTINGS ---- */
async function renderSettings(){
  var cfg={};try{cfg=await api('/api/config');S.config=cfg;}catch(e){}
  var wh=cfg.webhooks||[];
  var al=cfg.alert_config||{};
  var users=[];
  if(S.me&&S.me.role==='admin'){try{users=await api('/api/users');}catch(e){}}
  document.getElementById('content').innerHTML=
'<div class="two-col">'+
'<div class="card"><div class="card-title">Data Retention</div>'+
'<div class="fg"><label class="lbl">Delete events older than</label>'+
'<div class="flex"><input class="input" type="number" id="cfg-ret" value="'+(cfg.retention_days||30)+'" min="0" style="width:90px">'+
'<span style="font-size:13px;color:var(--tx3)">days &nbsp;(0 = disabled)</span></div></div>'+
'<button class="btn btn-primary" onclick="saveRetention()">Save</button></div>'+
'<div class="card"><div class="card-title">Alert Thresholds</div>'+
'<div class="fg"><label class="lbl">Alert when blocked packages exceed</label>'+
'<input class="input" type="number" id="cfg-blk" value="'+(al.blocked_per_minute||0)+'" min="0" style="width:120px"></div>'+
'<div class="fg flex"><label class="toggle"><input type="checkbox" id="cfg-ml"'+(al.malware_any?' checked':'')+'>'+
'<span class="tog-sl"></span></label><span style="font-size:13px">Alert on any malware detection</span></div>'+
'<button class="btn btn-primary" onclick="saveAlerts()">Save</button></div>'+
'</div>'+
'<div class="sec-title">Webhooks <small>'+wh.length+' configured</small>'+
'<button class="btn btn-primary btn-sm" onclick="openAddWebhook()">+ Add Webhook</button></div>'+
'<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>URL</th><th>Triggers</th><th>Status</th><th></th></tr></thead><tbody>'+
(wh.length?wh.map(function(w){
  return'<tr>'+
  '<td>'+h(w.name||'&mdash;')+'</td>'+
  '<td class="trunc mono" style="font-size:11px">'+h(w.url||'&mdash;')+'</td>'+
  '<td>'+(w.on_malware?bdg('malware','red'):'')+' '+(w.on_blocked?bdg('blocked','yellow'):'')+'</td>'+
  '<td>'+(w.enabled!==false?bdg('Enabled','green'):bdg('Disabled','gray'))+'</td>'+
  '<td class="flex" style="gap:4px">'+
  '<button class="btn btn-sm btn-ghost" onclick="toggleWebhook(\''+h(w.id)+'\','+(!(w.enabled!==false))+')">'+
  (w.enabled!==false?'Disable':'Enable')+'</button>'+
  '<button class="btn btn-sm btn-danger" onclick="deleteWebhook(\''+h(w.id)+'\')">Delete</button>'+
  '</td></tr>';
}).join(''):'<tr><td colspan="5" class="empty">No webhooks configured</td></tr>')+
'</tbody></table></div>'+
(S.me&&S.me.role==='admin'?
'<div class="sec-title" style="margin-top:18px">Users <small>'+users.length+' accounts</small>'+
'<button class="btn btn-primary btn-sm" onclick="openAddUser()">+ Add User</button></div>'+
'<div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead><tbody>'+
(users.length?users.map(function(u){
  return'<tr>'+
  '<td><strong>'+h(u.username)+'</strong>'+(u.must_change_password?' <span style="font-size:10px;color:var(--wn)">must change pwd</span>':'')+'</td>'+
  '<td>'+bdg(u.role==='admin'?'Admin':'Viewer',u.role==='admin'?'teal':'gray')+'</td>'+
  '<td style="font-size:12px;color:var(--tx3)">'+fmtDate(u.created_at)+'</td>'+
  '<td class="flex" style="gap:4px">'+
  '<button class="btn btn-sm btn-ghost" onclick="toggleUserRole(\''+h(u.id)+'\',\''+h(u.role)+'\')">'+
  (u.role==='admin'?'Make Viewer':'Make Admin')+'</button>'+
  '<button class="btn btn-sm btn-danger"'+(S.me&&u.id===S.me.id?' disabled':'')+' onclick="deleteUser(\''+h(u.id)+'\',\''+h(u.username)+'\')">Delete</button>'+
  '</td></tr>';
}).join(''):'<tr><td colspan="4" class="empty">No users</td></tr>')+
'</tbody></table></div>'
:'');
}

async function saveRetention(){
  var days=parseInt(document.getElementById('cfg-ret').value)||0;
  try{var c=await api('/api/config');c.retention_days=days;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});showToast('Saved!','success');}
  catch(e){showToast('Error: '+e.message,'error');}
}
async function saveAlerts(){
  var blk=parseInt(document.getElementById('cfg-blk').value)||0;
  var ml=document.getElementById('cfg-ml').checked;
  try{var c=await api('/api/config');c.alert_config=Object.assign(c.alert_config||{},{blocked_per_minute:blk,malware_any:ml});await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});S.config=c;showToast('Saved!','success');}
  catch(e){showToast('Error: '+e.message,'error');}
}

function openAddWebhook(){
  showModal('<div class="modal-title">Add Webhook <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="fg"><label class="lbl">Name</label><input class="input" id="wh-n" placeholder="e.g. Slack alerts"></div>'+
  '<div class="fg"><label class="lbl">URL</label><input class="input" id="wh-u" placeholder="https://hooks.example.com/..."></div>'+
  '<div class="fg flex"><label class="toggle"><input type="checkbox" id="wh-ml"><span class="tog-sl"></span></label><span style="font-size:13px">Trigger on malware detection</span></div>'+
  '<div class="fg flex"><label class="toggle"><input type="checkbox" id="wh-bl"><span class="tog-sl"></span></label><span style="font-size:13px">Trigger on blocked packages</span></div>'+
  '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addWebhook()">Add</button></div>');
}
async function addWebhook(){
  var url=(document.getElementById('wh-u')||{}).value;url=url?url.trim():'';if(!url)return;
  try{
    await fetch('/api/config/webhooks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:(document.getElementById('wh-n')||{}).value||'',url:url,
      on_malware:!!(document.getElementById('wh-ml')||{}).checked,
      on_blocked:!!(document.getElementById('wh-bl')||{}).checked,enabled:true})});
    closeModal();await renderSettings();
  }catch(e){showToast('Error: '+e.message,'error');}
}
async function toggleWebhook(id,enabled){
  try{var c=await api('/api/config');var w=(c.webhooks||[]).find(function(x){return x.id===id;});if(!w)return;await fetch('/api/config/webhooks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},w,{enabled:enabled}))});await renderSettings();}
  catch(e){showToast('Error: '+e.message,'error');}
}
async function deleteWebhook(id){
  if(!confirm('Delete this webhook?'))return;
  try{await fetch('/api/config/webhooks/'+id,{method:'DELETE'});await renderSettings();}
  catch(e){showToast('Error: '+e.message,'error');}
}

/* ---- MODAL ---- */
function showModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modal-body').innerHTML='';}

/* ---- SETUP WIZARD ---- */
var wizData={};
async function checkWizard(){
  try{var gs=await api('/api/groups');if(gs.length===0)showWizard(0);}catch(e){}
}
function showWizard(step){
  if(step===0){
    showModal('<div class="wiz-step"><div class="wiz-icon">&#128640;</div><div class="wiz-title">Welcome to PMG Cloud</div>'+
    '<div class="wiz-desc">Create your first group to start managing API keys for PMG agents connecting to this server.</div>'+
    '<div class="fg" style="text-align:left"><label class="lbl">Group Name</label>'+
    '<input class="input" id="wiz-gn" placeholder="e.g. Production team" onkeydown="if(event.key===\'Enter\')wizStep1()"></div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-ghost" onclick="closeModal()">Skip for now</button>'+
    '<button class="btn btn-primary" onclick="wizStep1()">Create Group &#8594;</button>'+
    '</div></div>');
    setTimeout(function(){var el=document.getElementById('wiz-gn');if(el)el.focus();},80);
  }else if(step===1){
    showModal('<div class="wiz-step"><div class="wiz-icon">&#128273;</div><div class="wiz-title">Create API Key</div>'+
    '<div class="wiz-desc">Create the first API key for group <strong>'+h(wizData.groupName)+'</strong>.</div>'+
    '<div class="fg" style="text-align:left"><label class="lbl">Key Name (optional)</label>'+
    '<input class="input" id="wiz-kn" placeholder="e.g. My workstation" onkeydown="if(event.key===\'Enter\')wizStep2()"></div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-ghost" onclick="closeModal();nav(\'groups\')">Skip</button>'+
    '<button class="btn btn-primary" onclick="wizStep2()">Create Key &#8594;</button>'+
    '</div></div>');
    setTimeout(function(){var el=document.getElementById('wiz-kn');if(el)el.focus();},80);
  }else if(step===2){
    var safeKey=h(wizData.secret||'');
    showModal('<div class="wiz-step"><div class="wiz-icon">&#9989;</div><div class="wiz-title">You\'re All Set!</div>'+
    '<div class="wiz-desc">Copy your API key and add it to your PMG configuration file.</div>'+
    '<div class="key-box">'+safeKey+'</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin:6px 0 4px;text-align:left">Add to <code>~/.pmg.yml</code>:</p>'+
    '<div class="key-box" style="font-size:11px">cloud:\n  api_key: "'+safeKey+'"\n  endpoint: "https://YOUR_SERVER:8443"</div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-primary" id="wiz-copy-btn" onclick="copyKey(\''+safeKey+'\');document.getElementById(\'wiz-copy-btn\').textContent=\'Copied ✓\'">&#128203; Copy Key</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();nav(\'dashboard\')">Go to Dashboard</button>'+
    '</div></div>');
  }
}
async function wizStep1(){
  var el=document.getElementById('wiz-gn');var name=el?el.value.trim():'';if(!name)return;
  try{
    var g=await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})}).then(function(r){return r.json();});
    wizData.groupId=g.id;wizData.groupName=name;
    await refreshGroupSel();showWizard(1);
  }catch(e){showToast('Error: '+e.message,'error');}
}
async function wizStep2(){
  var el=document.getElementById('wiz-kn');var kname=el?el.value.trim():'';
  try{
    var r=await fetch('/api/groups/'+wizData.groupId+'/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:kname})}).then(function(x){return x.json();});
    wizData.secret=r.secret||'';showWizard(2);
  }catch(e){showToast('Error: '+e.message,'error');}
}
</script>
