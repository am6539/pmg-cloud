<!DOCTYPE html>
<html lang="en" id="H">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMG Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--sf:#ffffff;--bd:#e2e8f0;--tx:#0f172a;--tx2:#1e293b;--tx3:#64748b;--tx4:#94a3b8;--pr:#0d9488;--pr2:#0f766e;--pr-bg:#f0fdfa;--dn:#dc2626;--dn-bg:#fef2f2;--wn:#d97706;--wn-bg:#fffbeb;--ok:#16a34a;--ok-bg:#f0fdf4;--hv:#f1f5f9;--hv2:#f8fafc;--sh:0 1px 2px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);--sh2:0 10px 30px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);--r:10px;--acc:#6366f1}
.dark{--bg:#0b1120;--sf:#111827;--bd:#1e2d3d;--tx:#f1f5f9;--tx2:#e2e8f0;--tx3:#94a3b8;--tx4:#475569;--pr-bg:#0d2d2a;--dn-bg:#300a0a;--wn-bg:#2d1a00;--ok-bg:#031a0d;--hv:#1a2535;--hv2:#111827;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden;transition:background .25s,color .25s;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:inherit}
/* Sidebar */
.sidebar{width:224px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;box-shadow:1px 0 0 var(--bd)}
.sidebar-logo{padding:18px 18px 14px;border-bottom:1px solid var(--bd);background:linear-gradient(135deg,var(--pr-bg) 0%,var(--sf) 100%)}
.sidebar-logo strong{font-size:15px;font-weight:700;color:var(--pr);letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.sidebar-logo small{display:block;font-size:10.5px;color:var(--tx4);margin-top:3px;letter-spacing:.2px}
.nav-section{font-size:9.5px;font-weight:700;color:var(--tx4);text-transform:uppercase;letter-spacing:1px;padding:12px 16px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7.5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx3);margin:1px 7px;white-space:nowrap;user-select:none;transition:background .12s,color .12s;font-weight:500}
.nav-item:hover{background:var(--hv);color:var(--tx2)}
.nav-item.active{background:var(--pr-bg);color:var(--pr);font-weight:600;box-shadow:inset 2px 0 0 var(--pr)}
/* Main area */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 20px;height:54px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:var(--sh)}
.topbar h1{font-size:14.5px;font-weight:600;flex-shrink:0;min-width:100px;letter-spacing:-.2px}
.tb-mid{flex:1;display:flex;align-items:center;gap:8px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tb-mid::-webkit-scrollbar{display:none}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.group-sel{padding:5px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-size:12.5px;max-width:150px;cursor:pointer}
.period-tabs{display:flex;gap:2px;background:var(--hv);border-radius:8px;padding:3px;flex-shrink:0}
.period-tab{padding:4px 12px;border-radius:6px;border:none;background:transparent;font-size:12px;cursor:pointer;color:var(--tx3);font-weight:500;white-space:nowrap;transition:all .12s}
.period-tab.active{background:var(--sf);color:var(--tx);box-shadow:var(--sh);font-weight:600}
.date-row{display:flex;align-items:center;gap:4px;font-size:12px;flex-shrink:0}
.date-row input{padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);font-size:12px;width:112px}
.icon-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:15px;flex-shrink:0;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hv);color:var(--tx)}
.alert-bar{padding:9px 20px;font-size:13px;display:none;align-items:center;gap:8px;flex-shrink:0;font-weight:500}
.alert-bar.warn{display:flex;background:var(--wn-bg);color:var(--wn);border-bottom:1px solid #fde68a}
.alert-bar.danger{display:flex;background:var(--dn-bg);color:var(--dn);border-bottom:1px solid #fca5a5}
.content{flex:1;overflow-y:auto;padding:24px 26px}
/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:17px 19px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:box-shadow .2s}
.kpi:hover{box-shadow:var(--sh2)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--pr);border-radius:var(--r) var(--r) 0 0;opacity:.3}
.kpi.danger::before{background:var(--dn);opacity:1}.kpi.warn::before{background:var(--wn);opacity:1}
.kpi-lbl{font-size:11.5px;color:var(--tx3);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.kpi-val{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.kpi-delta{font-size:11px;margin-top:5px;font-weight:500}
.d-up{color:var(--dn)}.d-dn{color:var(--ok)}.d-ne{color:var(--tx4)}
.kpi.danger .kpi-val{color:var(--dn)}.kpi.warn .kpi-val{color:var(--wn)}
/* Cards */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 19px;margin-bottom:18px;box-shadow:var(--sh)}
.card-title{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.1px}
/* Charts */
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:68px}
.cb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cb{width:100%;background:linear-gradient(180deg,var(--pr) 0%,var(--pr2) 100%);border-radius:3px 3px 0 0;min-height:2px;cursor:default;transition:opacity .15s}
.cb:hover{opacity:.7}
.cb-lbl{font-size:8px;color:var(--tx4);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;max-height:32px}
.heatmap{display:flex;gap:2px;flex-direction:column;flex-wrap:wrap;height:104px;align-content:flex-start}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--hv);flex-shrink:0;transition:opacity .1s}
.hm-cell:hover{opacity:.7}
.hm-cell.l1{background:#bbf7d0}.hm-cell.l2{background:#4ade80}.hm-cell.l3{background:#16a34a}.hm-cell.l4{background:#15803d}
.dark .hm-cell.l1{background:#14532d}.dark .hm-cell.l2{background:#166534}.dark .hm-cell.l3{background:#15803d}.dark .hm-cell.l4{background:#16a34a}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:920px){.two-col{grid-template-columns:1fr}}
.sec-title{font-size:14px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.1px}
.sec-title small{font-size:12px;font-weight:400;color:var(--tx3)}
/* Tables */
.tbl-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:18px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 14px;background:var(--hv2);color:var(--tx3);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bd)}
td{padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--tx2);transition:background .1s}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hv)}
.clickable{cursor:pointer}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.1px}
.b-red{background:var(--dn-bg);color:var(--dn)}.b-green{background:var(--ok-bg);color:var(--ok)}.b-yellow{background:var(--wn-bg);color:var(--wn)}.b-gray{background:var(--hv);color:var(--tx3)}.b-teal{background:var(--pr-bg);color:var(--pr)}.b-blue{background:#eff6ff;color:#1d4ed8}
.dark .b-blue{background:#1e3a5f;color:#93c5fd}
/* Status dots */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:#22c55e}.dot-yellow{background:#f59e0b}.dot-red{background:#ef4444}.dot-gray{background:var(--tx4)}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}}
.dot-pulse{animation:pulse-green 2s ease-in-out infinite}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7.5px 15px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;letter-spacing:-.1px}
.btn:hover{opacity:.88;transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-primary{background:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.3)}.btn-ghost{background:var(--sf);border:1px solid var(--bd);color:var(--tx2)}.btn-sm{padding:4.5px 11px;font-size:12px}.btn-danger{background:var(--dn-bg);color:var(--dn);border:1px solid #fca5a5}
.input{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:13px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.lbl{font-size:12px;font-weight:500;color:var(--tx3);margin-bottom:5px;display:block}
.fg{margin-bottom:14px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-size:12.5px}
.pager{display:flex;align-items:center;gap:8px;padding:8px 0}
.pager .info{font-size:12px;color:var(--tx3)}
/* Modal/overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:var(--sf);border-radius:14px;padding:24px;width:580px;max-width:96vw;max-height:87vh;overflow-y:auto;box-shadow:var(--sh2);border:1px solid var(--bd)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:17px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:17px;padding-top:15px;border-top:1px solid var(--bd)}
/* Drawer */
.drawer-bg{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.35);backdrop-filter:blur(1px)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:490px;max-width:95vw;background:var(--sf);border-left:1px solid var(--bd);box-shadow:var(--sh2);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .27s cubic-bezier(.4,0,.2,1)}
.drawer.open{transform:translateX(0)}
.drawer-hdr{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.drawer-hdr h2{font-size:15px;font-weight:600;letter-spacing:-.2px}
.drawer-body{padding:18px;overflow-y:auto;flex:1}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:15px;gap:2px}
.tab{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;transition:color .12s;border-radius:6px 6px 0 0}
.tab:hover{color:var(--tx2);background:var(--hv)}
.tab.active{color:var(--pr);border-bottom-color:var(--pr);font-weight:600}
/* Toggle */
.toggle{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--bd);border-radius:21px;cursor:pointer;transition:.2s}
.tog-sl::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.tog-sl{background:var(--pr)}
input:checked+.tog-sl::before{transform:translateX(17px)}
/* Misc */
.empty{text-align:center;padding:40px;color:var(--tx4);font-size:13px}
.mono{font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
hr{border:none;border-top:1px solid var(--bd);margin:14px 0}
.flex{display:flex;align-items:center;gap:8px}
.key-box{background:var(--hv);border-radius:9px;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;border:1px solid var(--bd);margin:10px 0;color:var(--tx2)}
.wiz-step{text-align:center;padding:12px 0}
.wiz-icon{font-size:46px;margin-bottom:13px}
.wiz-title{font-size:21px;font-weight:700;margin-bottom:9px;letter-spacing:-.3px}
.wiz-desc{color:var(--tx3);font-size:13.5px;margin-bottom:21px;line-height:1.65}
.bar-wrap{flex:1;height:6px;background:var(--hv);border-radius:3px;overflow:hidden;min-width:60px}
.bar-fill{height:6px;background:var(--pr);border-radius:3px;transition:width .3s ease}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--tx4)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
code{background:var(--hv);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
/* Login */
.login-overlay{position:fixed;inset:0;background:rgba(8,16,30,.8);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.login-box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:36px 38px;width:360px;max-width:94vw;box-shadow:var(--sh2)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .logo-icon{font-size:38px;margin-bottom:10px;display:block}
.login-logo strong{font-size:22px;font-weight:700;color:var(--pr);letter-spacing:-.4px;display:block}
.login-logo span{font-size:13px;color:var(--tx3);margin-top:5px;display:block}
/* Toast */
.toast-container{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 17px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--sh2);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:auto;max-width:340px;word-break:break-word;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:#052e16;color:#4ade80;border:1px solid #166534}
.toast-error{background:#450a0a;color:#fca5a5;border:1px solid #991b1b}
.toast-info{background:var(--sf);color:var(--tx2);border:1px solid var(--bd)}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<nav class="sidebar">
  <div class="sidebar-logo">
    <strong><span style="font-size:18px">&#11043;</span> PMG Cloud</strong>
    <small>Security Intelligence</small>
  </div>
  <div style="padding:6px 0 10px">
    <div class="nav-section">Analytics</div>
    <div class="nav-item active" onclick="nav('dashboard')" data-page="dashboard">&#128202; Overview</div>
    <div class="nav-item" onclick="nav('events')" data-page="events">&#128203; Events</div>
    <div class="nav-item" onclick="nav('endpoints')" data-page="endpoints">&#128187; Endpoints</div>
    <div class="nav-item" onclick="nav('packages')" data-page="packages">&#128230; Packages</div>
    <div class="nav-item" onclick="nav('cicd')" data-page="cicd">&#128256; CI / CD</div>
    <div class="nav-item" onclick="nav('malware')" data-page="malware">&#128737; Malware Feed</div>
    <div class="nav-section">Management</div>
    <div class="nav-item" onclick="nav('agents')" data-page="agents">&#128290; Agents</div>
    <div class="nav-item" onclick="nav('groups')" data-page="groups">&#128101; Groups</div>
    <div class="nav-item" onclick="nav('audit')" data-page="audit">&#128220; Audit Log</div>
    <div class="nav-item" onclick="nav('settings')" data-page="settings">&#9881; Settings</div>
  </div>
  <div id="sb-user-bar" style="padding:10px 12px;border-top:1px solid var(--bd);flex-shrink:0;display:none">
    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:6px">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--tx2)" id="sb-username"></div>
        <div style="font-size:11px;color:var(--tx4)" id="sb-role"></div>
      </div>
      <button class="icon-btn" onclick="doLogout()" title="Sign out" style="font-size:16px">&#10551;</button>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:100%;font-size:11px" onclick="showChangePwd()">&#128273; Change Password</button>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <h1 id="page-title">Overview</h1>
    <div class="tb-mid">
      <select class="group-sel" id="group-sel" onchange="setGroup(this.value)">
        <option value="">All groups</option>
      </select>
      <div class="period-tabs">
        <button class="period-tab" data-days="7" onclick="setPeriod(7)">7d</button>
        <button class="period-tab active" data-days="30" onclick="setPeriod(30)">30d</button>
        <button class="period-tab" data-days="90" onclick="setPeriod(90)">90d</button>
        <button class="period-tab" data-days="-1" onclick="showDateRange()">Custom</button>
      </div>
      <div class="date-row" id="date-row" style="display:none">
        <input type="date" id="from-date">
        <span style="color:var(--tx4)">&#8211;</span>
        <input type="date" id="to-date">
        <button class="btn btn-sm btn-primary" onclick="applyDateRange()">Apply</button>
      </div>
    </div>
    <div class="tb-right">
      <span id="ar-cd" style="font-size:11px;color:var(--tx4)"></span>
      <button class="icon-btn" onclick="loadPage()" title="Refresh">&#8635;</button>
      <button class="icon-btn" id="dark-btn" onclick="toggleDark()" title="Toggle dark mode">&#127769;</button>
    </div>
  </div>
  <div class="alert-bar" id="alert-bar"></div>
  <div class="content" id="content"><div class="empty"><span class="spin">&#8635;</span> Loading&#8230;</div></div>
</div>

<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body" onclick="event.stopPropagation()"></div>
</div>

<div class="drawer-bg" id="drawer-bg" style="display:none" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr">
    <h2 id="drawer-title">Details</h2>
    <button class="icon-btn" onclick="closeDrawer()">&#x2715;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="login-overlay" id="login-overlay" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <span class="logo-icon">&#11043;</span>
      <strong>PMG Cloud</strong>
      <span>Sign in to your security dashboard</span>
    </div>
    <div class="fg"><label class="lbl">Username</label><input class="input" id="li-user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fg"><label class="lbl">Password</label><input class="input" type="password" id="li-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div style="color:var(--dn);font-size:12px;margin-bottom:10px;min-height:18px" id="li-err"></div>
    <button class="btn btn-primary" style="width:100%;padding:9px" id="li-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<script>
/* ---- TOAST ---- */
function showToast(msg,type){
  var c=document.getElementById('toast-container');if(!c)return;
  var t=document.createElement('div');
  t.className='toast toast-'+(type||'info');
  t.textContent=msg;
  c.appendChild(t);
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('show');});});

/* ---- HELPERS ---- */
function fmt(n){return(n||0).toLocaleString();}
function fmtDate(s){if(!s)return'—';var d=new Date(s);return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function bdg(t,c){c=c||'gray';return'<span class="badge b-'+c+'">'+h(t)+'</span>';}
function actionBdg(a){var m={allow:'green',block:'red',suspicious:'yellow',allow_install:'teal',block_install:'red',allow_lockfile:'teal'};return bdg(a||'—',m[a]||'gray');}
function ecoBdg(e){var m={npm:'blue',pypi:'yellow',go:'teal',cargo:'red',maven:'gray',nuget:'blue'};return bdg(e||'—',m[(e||'').toLowerCase()]||'gray');}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trunc(s,n){n=n||30;return(!s)?'—':s.length>n?h(s.slice(0,n))+'…':h(s);}
function malwareBdg(v){if(v===true)return bdg('Malware','red');if(v===false)return bdg('Clean','green');return'—';}
function verifiedBdg(v){if(v===true)return bdg('Verified','teal');return'—';}

function computeDelta(days){
  if(!days||days.length<4)return'';
  var half=Math.floor(days.length/2);
  var prev=days.slice(0,half).reduce(function(s,d){return s+d.count;},0);
  var curr=days.slice(half).reduce(function(s,d){return s+d.count;},0);
  if(!prev)return'';
  var pct=Math.round((curr-prev)/prev*100);
  var cls=pct>0?'d-up':pct<0?'d-dn':'d-ne';
  var arrow=pct>0?'&#8593;':pct<0?'&#8595;':'&#8594;';
  return'<div class="kpi-delta '+cls+'">'+arrow+Math.abs(pct)+'% vs prev period</div>';
}

function buildChart(days){
  if(!days.length)return'<div class="empty">No data</div>';
  var max=Math.max.apply(null,days.map(function(d){return d.count;}).concat(1));
  return'<div class="chart-bars">'+days.slice(-30).map(function(d){
    var pct=Math.max(2,Math.round(d.count/max*100));
    return'<div class="cb-wrap"><div class="cb" style="height:'+pct+'%" title="'+h(d.date)+': '+d.count+'"></div><div class="cb-lbl">'+h(d.date.slice(5))+'</div></div>';
  }).join('')+'</div>';
}

function buildHeatmap(days){
  var map={};days.forEach(function(d){map[d.date]=d.count;});
  var vals=Object.values(map).concat(0);
  var max=Math.max.apply(null,vals);if(!max)max=1;
  var cells=[];
  for(var i=89;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var k=d.toISOString().slice(0,10);
    var c=map[k]||0;
    var l=c===0?'':c<max*.25?'l1':c<max*.5?'l2':c<max*.75?'l3':'l4';
    cells.push('<div class="hm-cell '+l+'" title="'+k+': '+c+'"></div>');
  }
  return'<div class="heatmap">'+cells.join('')+'</div>';
}

function barList(obj,colorMap){
  colorMap=colorMap||{};
  var entries=Object.entries(obj).sort(function(a,b){return b[1]-a[1];});
  if(!entries.length)return'<div class="empty">No data</div>';
  var mx=Math.max.apply(null,entries.map(function(e){return e[1];}).concat(1));
  return entries.map(function(e){
    return'<div class="flex" style="margin-bottom:7px">'+bdg(e[0],colorMap[(e[0]||'').toLowerCase()]||'gray')+
    '<div class="bar-wrap" style="margin:0 8px"><div class="bar-fill" style="width:'+Math.round(e[1]/mx*100)+'%"></div></div>'+
    '<span style="font-size:13px;font-weight:600;min-width:36px;text-align:right">'+fmt(e[1])+'</span></div>';
  }).join('');
}

}).join(''):'<tr><td colspan="10" class="empty">No endpoints</td></tr>')+
'</tbody></table></div>'+versionCompliance(epList);
}

function versionCompliance(eps){
  if(!eps.length)return'';
  var vc={};
  eps.forEach(function(ep){var v=ep.tool_version||'unknown';vc[v]=(vc[v]||0)+1;});
  var knownVers=Object.keys(vc).filter(function(v){return v!=='unknown';}).sort();
  var latest=knownVers.length?knownVers[knownVers.length-1]:'unknown';
  var outdated=eps.filter(function(ep){return(ep.tool_version||'unknown')!==latest;}).length;
  return'<div class="card"><div class="card-title">PMG Version Compliance '+
  (outdated>0?bdg(outdated+' outdated','red'):bdg('All up-to-date','green'))+'</div>'+
  '<p style="font-size:13px;color:var(--tx3);margin-bottom:12px">Latest detected: <strong>'+h(latest)+'</strong></p>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Version</th><th>Endpoints</th><th>Status</th></tr></thead><tbody>'+
  Object.keys(vc).sort().map(function(v){
    return'<tr><td class="mono">'+h(v)+'</td><td>'+vc[v]+'</td><td>'+(v===latest?bdg('Latest','green'):bdg('Outdated','yellow'))+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
}

var _pkgs=[];
async function renderPackages(){
  var ps=await api('/api/package-stats?'+buildQ());
  document.getElementById('content').innerHTML=
'<div class="tabs">'+

function pkgVersionsCell(p){
  var vs=p.versions||[];
  if(!vs.length)return'<span style="color:var(--tx4)">—</span>';
  var shown=vs.slice(0,3).map(function(v){return'<code style="font-size:10px">'+h(v)+'</code>';}).join(' ');
  if(vs.length>3)shown+=' <span style="font-size:10px;color:var(--tx4)">+'+(vs.length-3)+'</span>';
  return shown;
}
function pkgStatusCell(p){
  var b=[];
  if((p.malware_count||0)>0)b.push(bdg('Malware','red'));
  if((p.cooldown_blocked_count||0)>0)b.push(bdg('Cooldown','yellow'));
  var plainBlocked=(p.blocked_count||0)-(p.cooldown_blocked_count||0);
  if(plainBlocked>0&&(p.malware_count||0)===0)b.push(bdg('Blocked','red'));
  if(!b.length)b.push(bdg('Clean','green'));
  return b.join(' ');
}
function renderTopPkgs(pkgs){
  _pkgs=pkgs;
  document.getElementById('pkg-inner').innerHTML=
'<div class="tbl-wrap"><table><thead><tr><th>Package</th><th>Ecosystem</th><th>Versions</th><th>Status</th><th>Installs</th><th>Blocked</th><th>Malware</th><th>Last Seen</th></tr></thead><tbody>'+
(pkgs.length?pkgs.map(function(p,i){
  return'<tr class="clickable" onclick="openPkgModal('+i+')">'+
  '<td><strong>'+h(p.name)+'</strong></td>'+
  '<td>'+ecoBdg(p.ecosystem)+'</td>'+
  '<td>'+pkgVersionsCell(p)+'</td>'+
  '<td>'+pkgStatusCell(p)+'</td>'+
  '<td>'+fmt(p.count)+'</td>'+
  '<td>'+((p.blocked_count||0)>0?bdg(fmt(p.blocked_count),'red'):'0')+'</td>'+
  '<td>'+((p.malware_count||0)>0?bdg(fmt(p.malware_count),'red'):'<span style="color:var(--tx4)">0</span>')+'</td>'+
  '<td style="font-size:12px;color:var(--tx3)">'+fmtDate(p.last_seen)+'</td></tr>';
}).join(''):'<tr><td colspan="8" class="empty">No data</td></tr>')+
'</tbody></table></div>';
}

function renderRisk(pkgs){
  var sorted=pkgs.filter(function(p){return p.count>0;}).map(function(p){
    return Object.assign({},p,{risk:Math.round((p.blocked_count||0)/p.count*100)});
  }).sort(function(a,b){return b.risk-a.risk;});
  _pkgs=sorted;
  document.getElementById('pkg-inner').innerHTML=
'<div class="tbl-wrap"><table><thead><tr><th>Package</th><th>Ecosystem</th><th>Block Rate</th><th>Blocked</th><th>Total</th></tr></thead><tbody>'+
(sorted.length?sorted.map(function(p,i){
  var riskColor=p.risk>50?'var(--dn)':p.risk>20?'var(--wn)':'var(--pr)';
  return'<tr class="clickable" onclick="openPkgModal('+i+')">'+
  '<td><strong>'+h(p.name)+'</strong></td><td>'+ecoBdg(p.ecosystem)+'</td>'+
  '<td><div class="flex" style="gap:6px;min-width:80px">'+
  '<div class="bar-wrap"><div class="bar-fill" style="width:'+p.risk+'%;background:'+riskColor+'"></div></div>'+
  '<span style="font-size:12px;font-weight:600;color:'+riskColor+'">'+p.risk+'%</span></div></td>'+
  '<td>'+bdg(fmt(p.blocked_count||0),'red')+'</td><td>'+fmt(p.count)+'</td></tr>';
}).join(''):'<tr><td colspan="5" class="empty">No data</td></tr>')+
'</tbody></table></div>';
}

'<div class="tbl-wrap"><table><thead><tr><th>Ecosystem</th><th>Installs</th></tr></thead><tbody>'+
(eco.length?eco.map(function(e){return'<tr><td>'+ecoBdg(e.ecosystem||e.name)+'</td><td>'+fmt(e.count)+'</td></tr>';}).join(''):'<tr><td colspan="2" class="empty">No data</td></tr>')+

function openPkgModal(i){
  var p=_pkgs[i];if(!p)return;
  document.getElementById('modal-body').innerHTML=
'<div class="modal-title"><span>'+h(p.name)+' '+ecoBdg(p.ecosystem)+'</span><button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">'+
'<div class="kpi"><div class="kpi-lbl">Total Installs</div><div class="kpi-val" style="font-size:22px">'+fmt(p.count)+'</div></div>'+
'<div class="kpi'+((p.blocked_count||0)>0?' danger':'')+'"><div class="kpi-lbl">Blocked</div><div class="kpi-val" style="font-size:22px">'+fmt(p.blocked_count||0)+'</div></div>'+
'<div class="kpi'+((p.malware_count||0)>0?' danger':'')+'"><div class="kpi-lbl">Malware</div><div class="kpi-val" style="font-size:22px">'+fmt(p.malware_count||0)+'</div></div>'+
'<div class="kpi"><div class="kpi-lbl">Block Rate</div><div class="kpi-val" style="font-size:22px">'+(p.count>0?Math.round((p.blocked_count||0)/p.count*100):0)+'%</div></div>'+
'</div>'+
((p.versions&&p.versions.length)?'<div style="margin-bottom:14px;font-size:12px;color:var(--tx3)">Versions: '+p.versions.map(function(v){return'<code style="font-size:10px">'+h(v)+'</code>';}).join(' ')+'</div>':'')+
'<div id="pkg-evts"><div class="empty"><span class="spin">&#8635;</span></div></div>';
  document.getElementById('modal').style.display='flex';
  var q=new URLSearchParams({days:'90',limit:'100'});
  if(S.group)q.set('group_id',S.group);
  // Load events + agents in parallel so we can show the friendly device name
  // (label/hostname) per event instead of the cryptic endpoint id.
  Promise.all([
    api('/api/events?'+q.toString()),
    api('/api/agents').catch(function(){return [];})
  ]).then(function(res){
    var evs=res[0]||[];var agents=res[1]||[];
    var labelByHost={};
    agents.forEach(function(a){if(a.hostname)labelByHost[a.hostname.toLowerCase()]=a.label||'';});
    function machineCell(e){
      var host=e.hostname||'';
      var label=host?labelByHost[host.toLowerCase()]:'';
      if(label)return'<strong>'+h(label)+'</strong><div style="font-size:10px;color:var(--tx4)">'+h(host)+'</div>';
      if(host)return h(host);
      return'<span class="mono" style="font-size:10px;color:var(--tx4)">'+trunc(e.endpoint_id,16)+'</span>';
    }
    var fl=evs.filter(function(e){return e.package_name===p.name;});
    document.getElementById('pkg-evts').innerHTML=
'<div style="font-size:13px;font-weight:600;margin-bottom:8px">Recent Events ('+fl.length+')</div>'+
'<div class="tbl-wrap" style="max-height:280px;overflow-y:auto"><table>'+
'<thead><tr><th>Time</th><th>Machine</th><th>Action</th><th>Version</th><th>Malware</th><th>Verified</th><th>Analysis</th></tr></thead><tbody>'+
(fl.length?fl.map(function(e){
  var aid=e.analysis_id||'';
  var aidCell=aid?'<a href="https://app.safedep.io/analysis/'+h(aid)+'" target="_blank" class="mono" style="font-size:10px;color:var(--acc)">'+h(aid.slice(0,12))+'…</a>':'—';
  return'<tr><td style="font-size:12px">'+fmtDate(e.received_at)+'</td>'+
  '<td style="font-size:12px">'+machineCell(e)+'</td>'+
  '<td>'+actionBdg(e.action)+'</td>'+
  '<td class="mono">'+(e.package_version?h(e.package_version):'—')+'</td>'+
  '<td>'+malwareBdg(e.is_malware)+'</td>'+
  '<td>'+verifiedBdg(e.is_verified)+'</td>'+
  '<td>'+aidCell+'</td></tr>';
}).join(''):'<tr><td colspan="7" class="empty">No events</td></tr>')+
'</tbody></table></div>';
  }).catch(function(){});
}

async function renderAgents(){
  var agents=[];var tokens=[];
  try{agents=await api('/api/agents');}catch(e){}
  if(S.me&&S.me.role==='admin'){try{tokens=await api('/api/enrollment-tokens');}catch(e){}}
  var groups=S.groups||[];
  var H72=72*60*60*1000;
  var missing=agents.filter(function(a){return!a.last_seen||(Date.now()-new Date(a.last_seen).getTime())>=H72;});
  var missingBanner=missing.length?
    '<div class="alert-bar danger" style="display:flex;border-radius:9px;margin-bottom:16px;border:1px solid #fca5a5">'+
    '&#9888;&#65039; <strong>'+missing.length+' agent'+(missing.length>1?'s':'')+' may have PMG removed</strong> — last heartbeat &gt; 72 hours ago: '+
    missing.map(function(a){return'<code>'+h(a.hostname)+'</code>';}).join(', ')+'</div>':'';
  document.getElementById('content').innerHTML=
missingBanner+
(S.me&&S.me.role==='admin'?
'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
'<div class="sec-title" style="margin:0">Enrolled Agents <small>'+agents.length+' total</small></div>'+

(agents.length?agents.map(function(a){
  var grp=groups.find(function(g){return g.id===a.group_id;})||null;
  var age=a.last_seen?(Date.now()-new Date(a.last_seen).getTime()):Infinity;
  var H1=60*60*1000,H24=24*H1,H72=72*H1;
  var stLabel,stDot,stColor;
  if(age<H24){stLabel='Active';stDot='dot-green dot-pulse';stColor='var(--ok)';}
  else if(age<H72){stLabel='Idle';stDot='dot-yellow';stColor='var(--wn)';}
  else{stLabel='Missing PMG';stDot='dot-red';stColor='var(--dn)';}
  var statusCell='<td style="white-space:nowrap"><span class="dot '+stDot+'" style="display:inline-block;margin-right:5px"></span><span style="font-size:12px;font-weight:600;color:'+stColor+'">'+stLabel+'</span></td>';
  var deviceCell=a.label
    ? '<strong>'+h(a.label)+'</strong><div style="font-size:11px;color:var(--tx4)">'+h(a.hostname)+'</div>'
    : '<strong>'+h(a.hostname)+'</strong><div style="font-size:11px;color:var(--tx4)">unnamed</div>';
  return'<tr>'+statusCell+
  '<td>'+deviceCell+'</td>'+
  '<td style="font-size:12px;color:var(--tx3)">'+h(a.os||'')+(a.arch?' / '+h(a.arch):'')+(a.pmg_version?' &nbsp;<code>v'+h(a.pmg_version)+'</code>':'')+'</td>'+
  '<td>'+(grp?bdg(grp.name,'teal'):'<span style="color:var(--tx4)">unassigned</span>')+'</td>'+
  '<td style="font-size:12px;color:var(--tx3)">'+fmtDate(a.enrolled_at)+'</td>'+
  '<td style="font-size:12px;color:'+(age>H72?'var(--dn)':'var(--tx3)')+'">'+fmtDate(a.last_seen)+'</td>'+
  '<td class="flex" style="gap:4px">'+
  (S.me&&S.me.role==='admin'?
    '<button class="btn btn-sm btn-ghost" onclick="renameAgent(\''+h(a.id)+'\',\''+h(a.label||'')+'\')">Rename</button>'+
    '<button class="btn btn-sm btn-ghost" onclick="openAssignGroup(\''+h(a.id)+'\',\''+h(a.group_id||'')+'\')">Group</button>'+
    '<button class="btn btn-sm btn-danger" onclick="removeAgent(\''+h(a.id)+'\',\''+h(a.hostname)+'\')">Remove</button>':'')+
  '</td></tr>';
}).join(''):'<tr><td colspan="7" class="empty">No agents enrolled yet.</td></tr>')+
'</tbody></table></div>'+
(S.me&&S.me.role==='admin'?
'<div class="sec-title" style="margin-top:18px">Enrollment Tokens'+
'<button class="btn btn-ghost btn-sm" onclick="openCreateToken()">+ New Token</button></div>'+
'<div class="tbl-wrap"><table><thead><tr><th>Label</th><th>Prefix</th><th>Group</th><th>Uses</th><th>Expires</th><th></th></tr></thead><tbody>'+
(tokens.filter(function(t){return!t.revoked;}).length?
  tokens.filter(function(t){return!t.revoked;}).map(function(t){
    var grp=groups.find(function(g){return g.id===t.group_id;})||null;
    return'<tr>'+
    '<td><strong>'+h(t.label||'(no label)')+'</strong></td>'+
    '<td class="mono" style="font-size:11px">'+h(t.token_prefix)+'…</td>'+
    '<td>'+(grp?bdg(grp.name,'teal'):'<span style="color:var(--tx4)">any</span>')+'</td>'+
    '<td style="font-size:12px">'+(t.max_uses>0?t.use_count+'/'+t.max_uses:t.use_count+' (unlimited)')+'</td>'+
    '<td style="font-size:12px;color:var(--tx3)">'+fmtDate(t.expires_at)+'</td>'+
    '<td><button class="btn btn-sm btn-danger" onclick="revokeEnrollToken(\''+h(t.id)+'\')">Revoke</button></td></tr>';
  }).join(''):'<tr><td colspan="6" class="empty">No active tokens — use Deploy New Agent to create one.</td></tr>')+
'</tbody></table></div>'
:'');

function openDeployWizard(){
  window._wiz={step:1,os:'linux',arch:'x86_64',label:'',group_id:'',max_uses:1,ttl_hours:24};
  _showWizStep();
}

function _wizStepBar(cur){
  var steps=['Choose OS','Configure','Install'];
  return'<div style="display:flex;align-items:center;margin-bottom:20px">'+
  steps.map(function(s,i){
    var n=i+1;var done=n<cur;var active=n===cur;
    var bg=done?'var(--ok)':active?'var(--pr)':'var(--hv)';
    var tc=done||active?'#fff':'var(--tx3)';
    return'<div style="display:flex;align-items:center;gap:6px">'+
    '<div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:'+bg+';color:'+tc+'">'+
    (done?'✓':n)+'</div>'+
    '<span style="font-size:12px;font-weight:'+(active?600:400)+';color:'+(active?'var(--tx)':'var(--tx3)')+'">'+s+'</span>'+
    (n<steps.length?'<div style="width:28px;height:1px;background:var(--bd);margin:0 8px"></div>':'')+'</div>';
  }).join('')+'</div>';
}

function _showWizStep(){
  var w=window._wiz;var groups=S.groups||[];var body='';
  if(w.step===1){
    var osCard=function(os,lbl,icon){
      var sel=w.os===os;
      return'<div onclick="window._wiz.os=\''+os+'\';_showWizStep()" style="flex:1;cursor:pointer;border:2px solid '+(sel?'var(--pr)':'var(--bd)')+';border-radius:10px;padding:20px 12px;text-align:center;background:'+(sel?'var(--pr-bg)':'var(--sf)')+';transition:border .15s">'+
      '<div style="font-size:36px;margin-bottom:8px">'+icon+'</div>'+
      '<div style="font-weight:600;font-size:14px;color:'+(sel?'var(--pr)':'var(--tx)')+'">'+lbl+'</div></div>';
    };
    var archBtn=function(a,lbl){
      var sel=w.arch===a;
      return'<button onclick="window._wiz.arch=\''+a+'\';_showWizStep()" style="padding:7px 16px;border:1px solid '+(sel?'var(--pr)':'var(--bd)')+';border-radius:7px;background:'+(sel?'var(--pr-bg)':'var(--sf)')+';color:'+(sel?'var(--pr)':'var(--tx)')+';cursor:pointer;font-size:12.5px;font-weight:'+(sel?600:400)+'">'+lbl+'</button>';

    (w.os!=='windows'?
      '<div><div style="font-size:13px;font-weight:600;margin-bottom:8px">Architecture</div>'+
      '<div style="display:flex;gap:8px">'+archBtn('x86_64','x86_64 (Intel / AMD)')+archBtn('arm64','ARM64 (Apple Silicon / ARM)')+'</div></div>':
      '<div style="font-size:12px;color:var(--tx3);padding:10px 12px;background:var(--hv);border-radius:8px;margin-top:4px">Architecture is detected automatically on Windows.</div>')+
    '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="window._wiz.step=2;_showWizStep()">Next &rarr;</button></div>';
  }else if(w.step===2){
    var gOpts='<option value="">No group (assign later)</option>'+groups.map(function(g){return'<option value="'+h(g.id)+'"'+(g.id===w.group_id?' selected':'')+'>'+h(g.name)+'</option>';}).join('');
    body='<div class="fg"><label class="lbl">Label <span style="font-weight:400;color:var(--tx3)">(optional)</span></label>'+
    '<input class="input" id="wiz-label" placeholder="e.g. Production server" value="'+h(w.label)+'"></div>'+
    '<div class="fg"><label class="lbl">Assign to Group</label><select class="input" id="wiz-group">'+gOpts+'</select></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
    '<div class="fg"><label class="lbl">Max uses <span style="font-weight:400;color:var(--tx3)">(0 = unlimited)</span></label>'+
    '<input class="input" type="number" id="wiz-uses" value="'+w.max_uses+'" min="0"></div>'+
    '<div class="fg"><label class="lbl">Expires in hours <span style="font-weight:400;color:var(--tx3)">(0 = never)</span></label>'+
    '<input class="input" type="number" id="wiz-ttl" value="'+w.ttl_hours+'" min="0"></div></div>'+
    '<div class="modal-footer"><button class="btn btn-ghost" onclick="window._wiz.step=1;_showWizStep()">&larr; Back</button>'+
    '<button class="btn btn-primary" onclick="_wizDeploy()">Generate Install Command &rarr;</button></div>';
  }else{
    var cmd=w.installCmd||'';
    body='<div style="display:flex;align-items:center;gap:8px;color:var(--ok);font-size:13px;margin-bottom:14px">'+
    '<span style="font-size:20px">✓</span><strong>Token created.</strong> Run the command below on the target machine.</div>'+
    '<div style="font-size:12px;color:var(--tx3);margin-bottom:6px">OS: <strong>'+h(w.os)+'</strong> &nbsp;·&nbsp; Arch: <strong>'+h(w.arch)+'</strong></div>'+
    '<div class="key-box" style="font-size:11.5px;word-break:break-all;line-height:1.6" id="wiz-cmd-box">'+h(cmd)+'</div>'+
    '<div style="font-size:11.5px;color:var(--tx3);margin-top:10px;line-height:1.5">'+(w.os==='windows'?'Run in <strong>PowerShell</strong> (not CMD). The script installs PMG, enrolls the machine, and adds pmg.exe to PATH automatically.':'This command installs PMG, enrolls the machine, and wires PMG into the shell automatically.')+'<br>Restart the terminal after running to activate.</div>'+
    '<div class="modal-footer">'+
    '<button class="btn btn-primary" id="wiz-copy-btn" onclick="navigator.clipboard.writeText(document.getElementById(\'wiz-cmd-box\').textContent).then(function(){document.getElementById(\'wiz-copy-btn\').textContent=\'✓ Copied\';})">&#128203; Copy Command</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();renderAgents()">Done</button></div>';
  }
  showModal('<div class="modal-title">Deploy New Agent <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+_wizStepBar(w.step)+body);
  if(w.step===2){setTimeout(function(){var el=document.getElementById('wiz-label');if(el)el.focus();},80);}
}

async function _wizDeploy(){
  var w=window._wiz;
  w.label=(document.getElementById('wiz-label')||{}).value||'';
  w.group_id=(document.getElementById('wiz-group')||{}).value||'';
  w.max_uses=parseInt((document.getElementById('wiz-uses')||{}).value)||0;
  w.ttl_hours=parseInt((document.getElementById('wiz-ttl')||{}).value)||0;
  try{
    var r=await fetch('/api/enrollment-tokens',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label:w.label,group_id:w.group_id,max_uses:w.max_uses,ttl_hours:w.ttl_hours})});
    if(!r.ok){var d=await r.json().catch(function(){return{};});showToast(d.error||'Error','error');return;}
    var data=await r.json();
    var origin=window.location.origin;
    w.installCmd=w.os==='windows'
      ?'$env:PMG_TOKEN=\''+data.secret+'\'; irm '+origin+'/install.ps1 | iex'
      :'curl -fsSL '+origin+'/install.sh | sh -s -- --token='+data.secret;
    w.step=3;_showWizStep();
  }catch(e){showToast('Error: '+e.message,'error');}
}

async function createEnrollToken(){
  var label=(document.getElementById('et-label')||{}).value||'';
  var groupId=(document.getElementById('et-group')||{}).value||'';
  var maxUses=parseInt((document.getElementById('et-uses')||{}).value)||0;
  var ttlHours=parseInt((document.getElementById('et-ttl')||{}).value)||0;
  try{
    var r=await fetch('/api/enrollment-tokens',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label:label,group_id:groupId,max_uses:maxUses,ttl_hours:ttlHours})});
    if(!r.ok){var d=await r.json().catch(function(){return{};});showToast(d.error||'Error','error');return;}
    var data=await r.json();
    var token=data.secret||'';
    var origin=window.location.origin;
    var installCmd='curl -fsSL '+origin+'/install.sh | sh -s -- --token='+token;
    closeModal();
    showModal('<div class="modal-title">&#10003; Token Created <button class="icon-btn" onclick="closeModal();renderAgents()">&#x2715;</button></div>'+
    '<div style="color:var(--dn);font-size:13px;margin-bottom:10px;padding:10px;background:var(--dn-bg);border-radius:8px">'+
    '&#9888;&#65039; Copy this token now — it will <strong>not</strong> be shown again.</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin-bottom:4px">Token:</p>'+
    '<div class="key-box" id="et-token-box">'+h(token)+'</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin:10px 0 4px">One-line install command:</p>'+
    '<div class="key-box" style="font-size:11px" id="et-cmd-box">'+h(installCmd)+'</div>'+
    '<div class="modal-footer">'+
    '<button class="btn btn-primary" id="et-copy-btn" onclick="navigator.clipboard.writeText(document.getElementById(\'et-cmd-box\').textContent).then(function(){document.getElementById(\'et-copy-btn\').textContent=\'Copied ✓\';})">&#128203; Copy Command</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();renderAgents()">Done</button></div>');
  }catch(e){showToast('Error: '+e.message,'error');}
}

async function revokeEnrollToken(id){

  catch(e){showToast('Error: '+e.message,'error');}

async function assignAgentGroup(id){

    showToast('Device name updated','success');
    await renderAgents();
  }catch(e){showToast('Error: '+e.message,'error');}

async function createGroup(){
  var name=(document.getElementById('ng-name')||{}).value;
  name=name?name.trim():'';if(!name)return;
  try{

function copyKey(safeStr){
  var raw=safeStr.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');

}

async function uploadPmgBinary(input){
  var goos=input.dataset.os,arch=input.dataset.arch;
  var file=input.files[0];if(!file)return;
  var label=input.closest('label');
  label.textContent='Uploading…';label.style.pointerEvents='none';
  try{
    var fd=new FormData();fd.append('file',file);
    var r=await fetch('/api/config/pmg-update/upload?os='+goos+'&arch='+arch,{method:'POST',body:fd});
    if(!r.ok){var d=await r.json().catch(function(){return{};});throw new Error(d.error||'Upload failed');}
    showToast('Uploaded '+goos+'/'+arch+' binary','success');
    await renderSettings();
  }catch(e){showToast(e.message,'error');label.textContent='↑ Upload';label.style.pointerEvents='';}
}

async function publishPmgUpdate(){
  var ver=(document.getElementById('pmg-target-ver')||{}).value||'';
  if(!ver)return showToast('Enter a version first','error');
  if(!confirm('Publish target version "'+ver+'"? All enrolled agents will update on next heartbeat.'))return;
  try{
    var r=await fetch('/api/config/pmg-update/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:ver})});
    if(!r.ok)throw new Error(await r.text());
    showToast('Published target version '+ver,'success');
    await renderSettings();
  }catch(e){showToast(e.message,'error');}
}

async function scanPmgBinaries(btn){
  btn.disabled=true;btn.textContent='Scanning…';
  try{
    var r=await fetch('/api/config/pmg-update/scan',{method:'POST'});
    if(!r.ok)throw new Error(await r.text());
    var d=await r.json();
    var found=d.scanned||0;
    var newCount=(d.results||[]).filter(function(x){return x.new;}).length;
    showToast('Scan complete: '+found+' file'+(found!==1?'s':'')+' found'+(newCount?' ('+newCount+' new)':''),'success');
    await renderSettings();
  }catch(e){showToast('Scan failed: '+e.message,'error');btn.disabled=false;btn.textContent='🔍 Scan';}
}

async function fetchPmgFromGitHub(btn){
  btn.disabled=true;btn.textContent='Fetching…';
  try{
    var r=await fetch('/api/config/pmg-update/fetch',{method:'POST'});
    if(!r.ok)throw new Error(await r.text());
    var d=await r.json();
    var n=(d.results||[]).length;
    showToast('Fetched '+d.version+': '+n+' platform'+(n!==1?'s':''),'success');
    // store so renderPmgUpdateSection() picks it up as the pre-filled version
    S.pendingUpdateVersion=d.version||null;
    await renderSettings();
  }catch(e){showToast('Fetch failed: '+e.message,'error');btn.disabled=false;btn.textContent='↓ GitHub';}
}

async function saveRetention(){
  var days=parseInt(document.getElementById('cfg-ret').value)||0;
  try{var c=await api('/api/config');c.retention_days=days;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});showToast('Saved!','success');}
  catch(e){showToast('Error: '+e.message,'error');}
}
async function saveAlerts(){
  var blk=parseInt(document.getElementById('cfg-blk').value)||0;
  var ml=document.getElementById('cfg-ml').checked;
  try{var c=await api('/api/config');c.alert_config=Object.assign(c.alert_config||{},{blocked_per_minute:blk,malware_any:ml});await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});S.config=c;showToast('Saved!','success');}
  catch(e){showToast('Error: '+e.message,'error');}
}

function openAddWebhook(){
  showModal('<div class="modal-title">Add Webhook <button class="icon-btn" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="fg"><label class="lbl">Name</label><input class="input" id="wh-n" placeholder="e.g. Slack alerts"></div>'+
  '<div class="fg"><label class="lbl">URL</label><input class="input" id="wh-u" placeholder="https://hooks.example.com/..."></div>'+
  '<div class="fg flex"><label class="toggle"><input type="checkbox" id="wh-ml"><span class="tog-sl"></span></label><span style="font-size:13px">Trigger on malware detection</span></div>'+
  '<div class="fg flex"><label class="toggle"><input type="checkbox" id="wh-bl"><span class="tog-sl"></span></label><span style="font-size:13px">Trigger on blocked packages</span></div>'+
  '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addWebhook()">Add</button></div>');
}
async function addWebhook(){
  var url=(document.getElementById('wh-u')||{}).value;url=url?url.trim():'';if(!url)return;
  try{
    await fetch('/api/config/webhooks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:(document.getElementById('wh-n')||{}).value||'',url:url,
      on_malware:!!(document.getElementById('wh-ml')||{}).checked,
      on_blocked:!!(document.getElementById('wh-bl')||{}).checked,enabled:true})});
    closeModal();await renderSettings();
  }catch(e){showToast('Error: '+e.message,'error');}
}
async function toggleWebhook(id,enabled){
  try{var c=await api('/api/config');var w=(c.webhooks||[]).find(function(x){return x.id===id;});if(!w)return;await fetch('/api/config/webhooks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},w,{enabled:enabled}))});await renderSettings();}
  catch(e){showToast('Error: '+e.message,'error');}
}
async function deleteWebhook(id){
  if(!confirm('Delete this webhook?'))return;
  try{await fetch('/api/config/webhooks/'+id,{method:'DELETE'});await renderSettings();}
  catch(e){showToast('Error: '+e.message,'error');}
}

/* ---- MODAL ---- */
function showModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modal-body').innerHTML='';}

/* ---- SETUP WIZARD ---- */
var wizData={};
async function checkWizard(){
  try{var gs=await api('/api/groups');if(gs.length===0)showWizard(0);}catch(e){}
}
function showWizard(step){
  if(step===0){
    showModal('<div class="wiz-step"><div class="wiz-icon">&#128640;</div><div class="wiz-title">Welcome to PMG Cloud</div>'+
    '<div class="wiz-desc">Create your first group to start managing API keys for PMG agents connecting to this server.</div>'+
    '<div class="fg" style="text-align:left"><label class="lbl">Group Name</label>'+
    '<input class="input" id="wiz-gn" placeholder="e.g. Production team" onkeydown="if(event.key===\'Enter\')wizStep1()"></div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-ghost" onclick="closeModal()">Skip for now</button>'+
    '<button class="btn btn-primary" onclick="wizStep1()">Create Group &#8594;</button>'+
    '</div></div>');
    setTimeout(function(){var el=document.getElementById('wiz-gn');if(el)el.focus();},80);
  }else if(step===1){
    showModal('<div class="wiz-step"><div class="wiz-icon">&#128273;</div><div class="wiz-title">Create API Key</div>'+
    '<div class="wiz-desc">Create the first API key for group <strong>'+h(wizData.groupName)+'</strong>.</div>'+
    '<div class="fg" style="text-align:left"><label class="lbl">Key Name (optional)</label>'+
    '<input class="input" id="wiz-kn" placeholder="e.g. My workstation" onkeydown="if(event.key===\'Enter\')wizStep2()"></div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-ghost" onclick="closeModal();nav(\'groups\')">Skip</button>'+
    '<button class="btn btn-primary" onclick="wizStep2()">Create Key &#8594;</button>'+
    '</div></div>');
    setTimeout(function(){var el=document.getElementById('wiz-kn');if(el)el.focus();},80);
  }else if(step===2){
    var safeKey=h(wizData.secret||'');
    showModal('<div class="wiz-step"><div class="wiz-icon">&#9989;</div><div class="wiz-title">You\'re All Set!</div>'+
    '<div class="wiz-desc">Copy your API key and add it to your PMG configuration file.</div>'+
    '<div class="key-box">'+safeKey+'</div>'+
    '<p style="font-size:12px;color:var(--tx3);margin:6px 0 4px;text-align:left">Add to <code>~/.pmg.yml</code>:</p>'+
    '<div class="key-box" style="font-size:11px">cloud:\n  api_key: "'+safeKey+'"\n  endpoint: "https://YOUR_SERVER:8443"</div>'+
    '<div class="modal-footer" style="justify-content:center">'+
    '<button class="btn btn-primary" id="wiz-copy-btn" onclick="copyKey(\''+safeKey+'\');document.getElementById(\'wiz-copy-btn\').textContent=\'Copied ✓\'">&#128203; Copy Key</button>'+
    '<button class="btn btn-ghost" onclick="closeModal();nav(\'dashboard\')">Go to Dashboard</button>'+
    '</div></div>');
  }
}
async function wizStep1(){
  var el=document.getElementById('wiz-gn');var name=el?el.value.trim():'';if(!name)return;
  try{
    var g=await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})}).then(function(r){return r.json();});
    wizData.groupId=g.id;wizData.groupName=name;
    await refreshGroupSel();showWizard(1);
  }catch(e){showToast('Error: '+e.message,'error');}
}
async function wizStep2(){
  var el=document.getElementById('wiz-kn');var kname=el?el.value.trim():'';
  try{
    var r=await fetch('/api/groups/'+wizData.groupId+'/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:kname})}).then(function(x){return x.json();});
    wizData.secret=r.secret||'';showWizard(2);
  }catch(e){showToast('Error: '+e.message,'error');}
}
</script>
