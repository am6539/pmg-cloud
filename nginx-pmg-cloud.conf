# Nginx Reverse Proxy Configuration cho PMG Cloud
# File: /etc/nginx/sites-available/pmg-cloud

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name package.thanhvpga.qzz.io;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name package.thanhvpga.qzz.io;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/package.thanhvpga.qzz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/package.thanhvpga.qzz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/pmg-cloud-access.log;
    error_log /var/log/nginx/pmg-cloud-error.log;

    # Client body size (cho uploads)
    client_max_body_size 10M;

    # Proxy to dashboard
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (nếu dashboard có real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
}

# gRPC endpoint
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name package.thanhvpga.qzz.io;

    # SSL configuration (same as above)
    ssl_certificate /etc/letsencrypt/live/package.thanhvpga.qzz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/package.thanhvpga.qzz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/pmg-cloud-grpc-access.log;
    error_log /var/log/nginx/pmg-cloud-grpc-error.log;

    # gRPC proxy
    location / {
        grpc_pass grpc://127.0.0.1:8443;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts cho long-running gRPC streams
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }
}

# Rate limiting configuration (thêm vào nginx.conf hoặc đầu file này)
# limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=100r/s;
#
# Trong location blocks, thêm:
# limit_req zone=dashboard_limit burst=20 nodelay;
